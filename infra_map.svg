<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <style>
      .bg{fill:#ffffff}
      .host{fill:#f6f8fb;stroke:#98a2b3;stroke-width:1.5}
      .node{fill:#eef2f9;stroke:#3b5bdb;stroke-width:1.5;stroke-dasharray:6 4}
      .ns{fill:#ffffff;stroke:#667085;stroke-width:1.2}
      .cp{fill:#e8eefc;stroke:#3b5bdb;stroke-width:1.5}
      .up{fill:#e3f6ee;stroke:#0b8a66;stroke-width:1.5}
      .ran{fill:#f1ebfd;stroke:#7048e8;stroke-width:1.5}
      .db{fill:#fff4e0;stroke:#c76b00;stroke-width:1.5}
      .mon{fill:#fdeaea;stroke:#d6303a;stroke-width:1.5}
      .tool{fill:#f1f3f5;stroke:#667085;stroke-width:1.5}
      .t{fill:#1c2330}.m{fill:#667085;font-size:11.5px}.h{font-weight:700;font-size:14px;fill:#1c2330}
      .sbi{stroke:#3b5bdb;stroke-width:2;fill:none}
      .n2{stroke:#7048e8;stroke-width:2.5;fill:none}
      .n3{stroke:#0b8a66;stroke-width:2.5;fill:none}
      .n4{stroke:#c76b00;stroke-width:2.5;fill:none}
      .n6{stroke:#d6303a;stroke-width:2.5;fill:none}
      .cap{stroke:#667085;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .lbl{font-size:11.5px;font-weight:600}
    </style>
  </defs>
  <rect class="bg" width="1200" height="860"/>
  <text x="24" y="34" class="t" font-size="20" font-weight="700">5G lab infrastructure map</text>
  <text x="24" y="54" class="m">Laptop (Linux) &#8594; Docker &#8594; kind cluster "5glab" &#8594; free5GC 5G core + UERANSIM RAN. Captured traffic is analysed with pcapx.</text>

  <!-- HOST -->
  <rect class="host" x="16" y="70" width="1168" height="770" rx="12"/>
  <text x="32" y="92" class="h">Host: laptop (Linux, Docker)</text>

  <!-- pcapx tooling on host -->
  <rect class="tool" x="32" y="712" width="360" height="112" rx="8"/>
  <text x="46" y="734" class="h">pcapx web UI  (host, localhost:8000)</text>
  <text x="46" y="754" class="m">server.py &#8594; pcapx.py &#8594; tshark / sharkd / editcap</text>
  <text x="46" y="772" class="m">reads *.pcap / *.pcapng / *.cap from the project folder</text>
  <text x="46" y="790" class="m">ladder diagram, identity filters (imsi, teid, seid, ...)</text>
  <text x="46" y="808" class="m">export filtered pcap</text>

  <rect class="tool" x="420" y="712" width="200" height="112" rx="8"/>
  <text x="434" y="734" class="h">trace.pcapng</text>
  <text x="434" y="754" class="m">222 MB, 330k packets</text>
  <text x="434" y="772" class="m">linux-sll2 ("any" iface)</text>
  <text x="434" y="790" class="m">~21 min capture</text>
  <line x1="392" y1="768" x2="420" y2="768" class="sbi" marker-end="url(#ah)"/>

  <!-- KIND: docker containers -->
  <rect class="host" x="32" y="104" width="1136" height="590" rx="10"/>
  <text x="46" y="126" class="h">kind cluster "5glab" &#8212; Kubernetes v1.31, 2 Docker containers on one bridge network</text>

  <!-- control plane -->
  <rect class="node" x="46" y="140" width="220" height="130" rx="8"/>
  <text x="58" y="160" class="h">5glab-control-plane</text>
  <text x="58" y="178" class="m">Docker container</text>
  <text x="58" y="196" class="m">kube-apiserver</text>
  <text x="58" y="212" class="m">etcd, scheduler, controller-mgr</text>
  <text x="58" y="228" class="m">coredns x2, kube-proxy, kindnet</text>
  <text x="58" y="244" class="m">multus (thick), local-path-provisioner</text>

  <!-- worker -->
  <rect class="node" x="280" y="140" width="876" height="540" rx="8"/>
  <text x="292" y="160" class="h">5glab-worker   (runs every 5G pod)</text>

  <!-- namespace free5gc -->
  <rect class="ns" x="294" y="172" width="848" height="400" rx="8"/>
  <text x="306" y="192" class="h">namespace: free5gc</text>

  <!-- RAN column -->
  <rect class="ran" x="310" y="210" width="190" height="72" rx="8"/>
  <text x="322" y="232" class="h">UE  (UERANSIM)</text>
  <text x="322" y="250" class="m">imsi-208930000000003</text>
  <text x="322" y="266" class="m">uesimtun0 tunnel interface</text>

  <rect class="ran" x="310" y="330" width="190" height="90" rx="8"/>
  <text x="322" y="352" class="h">gNB-1 (lab-gnb)</text>
  <text x="322" y="370" class="m">N2 NGAP (SCTP)</text>
  <text x="322" y="386" class="m">N3 GTP-U (UDP)</text>
  <text x="322" y="402" class="m">link: gnb-service 4997/udp</text>

  <rect class="ran" x="310" y="448" width="190" height="90" rx="8"/>
  <text x="322" y="470" class="h">gNB-2 (tower2-gnb)</text>
  <text x="322" y="488" class="m">N2 NGAP (SCTP)</text>
  <text x="322" y="504" class="m">N3 GTP-U (UDP)</text>
  <text x="322" y="520" class="m">link: gnb2-service 4997/udp</text>

  <!-- UE -> gNB radio -->
  <line x1="405" y1="282" x2="405" y2="330" stroke="#7048e8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#ah)"/>
  <text x="414" y="312" class="m">RRC / radio (sim)</text>

  <!-- AMF -->
  <rect class="cp" x="600" y="330" width="150" height="72" rx="8"/>
  <text x="612" y="352" class="h">AMF</text>
  <text x="612" y="370" class="m">N2 NGAP, SCTP 38412</text>
  <text x="612" y="386" class="m">SBI HTTP/2, port 80</text>

  <!-- SMF -->
  <rect class="cp" x="790" y="330" width="150" height="72" rx="8"/>
  <text x="802" y="352" class="h">SMF</text>
  <text x="802" y="370" class="m">N4 PFCP, UDP 8805</text>
  <text x="802" y="386" class="m">SBI HTTP/2, port 80</text>

  <!-- UPF -->
  <rect class="up" x="790" y="448" width="250" height="110" rx="8"/>
  <text x="802" y="470" class="h">UPF  (gtp5g)</text>
  <text x="802" y="488" class="m">N3 GTP-U, UDP 2152</text>
  <text x="802" y="504" class="m">N4 PFCP, UDP 8805</text>
  <text x="802" y="520" class="m">N6 NAT to the internet (dnn internet)</text><text x="802" y="536" class="m">UE address pool</text>

  <!-- SBI cluster -->
  <rect class="cp" x="600" y="210" width="530" height="96" rx="8"/>
  <text x="612" y="230" class="h">Service-based interface (HTTP/2, port 80, kindnet pod network)</text>
  <text x="612" y="252" class="m">NRF (nrf-nnrf:8000)   AUSF   UDM   UDR   PCF   NSSF   + AMF / SMF above</text>
  <text x="612" y="270" class="m">NF discovery and registration via NRF; SUPI/GPSI travel in JSON and URLs</text>
  <text x="612" y="288" class="m">ClusterIP services  (kube-proxy DNAT &#8594; "NAT twin" packets in the trace)</text>

  <!-- MongoDB / webui -->
  <rect class="db" x="1052" y="330" width="80" height="72" rx="8"/>
  <text x="1060" y="352" class="h">Mongo</text>
  <text x="1060" y="370" class="m">DB</text>
  <text x="1060" y="386" class="m">:27017</text>
  <rect class="db" x="1052" y="448" width="80" height="110" rx="8"/>
  <text x="1058" y="470" class="h">WebUI</text>
  <text x="1058" y="488" class="m">manage subs</text>
  <text x="1058" y="504" class="m">NodePort</text>
  <text x="1058" y="520" class="m">:30500</text>

  <!-- links -->
  <!-- N2 gNBs -> AMF -->
  <path class="n2" d="M500,375 L600,366" marker-end="url(#ah)"/>
  <path class="n2" d="M500,493 C560,493 560,390 600,382" marker-end="url(#ah)"/>
  <text x="506" y="356" class="lbl" fill="#7048e8">N2 NGAP/SCTP</text>
  <!-- AMF -> SMF (SBI) -->
  <path class="sbi" d="M750,366 L790,366" marker-end="url(#ah)"/>
  <text x="754" y="358" class="lbl" fill="#3b5bdb">Nsmf</text>
  <!-- SMF -> UPF N4 -->
  <path class="n4" d="M865,402 L865,448" marker-end="url(#ah)"/>
  <text x="872" y="430" class="lbl" fill="#c76b00">N4 PFCP/UDP</text>
  <!-- gNB -> UPF N3 -->
  <path class="n3" d="M500,404 C640,430 700,480 790,490" marker-end="url(#ah)"/>
  <path class="n3" d="M500,524 C640,530 720,528 790,522" marker-end="url(#ah)"/>
  <text x="600" y="556" class="lbl" fill="#0b8a66">N3 GTP-U/UDP</text>
  <!-- UPF -> internet N6 -->
  <path class="n6" d="M910,558 L910,600" marker-end="url(#ah)"/>
  <text x="920" y="584" class="lbl" fill="#d6303a">N6 (NAT)</text>
  <!-- SBI to Mongo -->
  <path class="sbi" d="M1092,306 L1092,330"/>

  <!-- Internet -->
  <rect class="tool" x="790" y="600" width="240" height="46" rx="23"/>
  <text x="910" y="628" text-anchor="middle" class="h">Internet (ping OK)</text>

  <!-- monitoring namespace -->
  <rect class="ns" x="294" y="578" width="470" height="90" rx="8"/>
  <text x="306" y="598" class="h">namespace: monitoring</text>
  <rect class="mon" x="310" y="610" width="130" height="46" rx="6"/>
  <text x="320" y="630" class="h">Prometheus</text><text x="320" y="647" class="m">:9090</text>
  <rect class="mon" x="452" y="610" width="130" height="46" rx="6"/>
  <text x="462" y="630" class="h">Grafana</text><text x="462" y="647" class="m">:3000</text>
  <rect class="mon" x="594" y="610" width="160" height="46" rx="6"/>
  <text x="604" y="630" class="h">kube-state-metrics</text><text x="604" y="647" class="m">:8080</text>

  <!-- capture -->
  <path class="cap" d="M280,560 C200,600 200,700 240,712" marker-end="url(#ah)"/>
  <text x="46" y="612" class="m">tcpdump -i any on worker</text>
  <text x="46" y="628" class="m">(docker exec 5glab-worker)</text>
  <text x="46" y="644" class="m">&#8594; docker cp &#8594; pcapng</text>

  <!-- legend -->
  <rect class="ns" x="640" y="712" width="528" height="112" rx="8"/>
  <text x="654" y="734" class="h">Legend: Multus ipvlan-l2 secondary networks (static addressing)</text>
  <line x1="654" y1="752" x2="690" y2="752" class="n2"/><text x="698" y="756" class="m">N2  gNB &#8596; AMF   (NGAP, SCTP 38412)</text>
  <line x1="654" y1="772" x2="690" y2="772" class="n3"/><text x="698" y="776" class="m">N3  gNB &#8596; UPF   (GTP-U, UDP 2152)</text>
  <line x1="654" y1="792" x2="690" y2="792" class="n4"/><text x="698" y="796" class="m">N4  SMF &#8596; UPF   (PFCP, UDP 8805)</text>
  <line x1="654" y1="812" x2="690" y2="812" class="sbi"/><text x="698" y="816" class="m">SBI  NF &#8596; NF     pod network (HTTP/2)</text>
</svg>
